name: pr-fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read

# Unrelated comments must not cancel a running fix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ github.event.comment.body == 'fix' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  load-pr:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == 'fix' &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      base_repo: ${{ steps.pr.outputs.base_repo }}
    runs-on: ubuntu-24.04

    steps:
      - name: Load PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_API_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${PR_API_URL}" > /tmp/pr.json

          {
            echo "head_ref=$(jq -r '.head.ref' /tmp/pr.json)"
            echo "head_sha=$(jq -r '.head.sha' /tmp/pr.json)"
            echo "head_repo=$(jq -r '.head.repo.full_name' /tmp/pr.json)"
            echo "base_repo=$(jq -r '.base.repo.full_name' /tmp/pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Reject fork PRs
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          BASE_REPO: ${{ steps.pr.outputs.base_repo }}
        run: |
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::error::fix only supports pull requests from branches in ${GITHUB_REPOSITORY}."
            exit 1
          fi

  fix-part:
    needs: load-pr
    runs-on: ubuntu-24.04
    env:
      # kache 0.12 can report build-script hits without restoring Cargo's expected executable.
      KACHE_CACHE_EXECUTABLES: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: embedded-assets-hash
            artifact: pr-fix-embedded-assets-hash
            commit_message: "chore: Update embedded assets hash"
            needs_postgres: "false"
            cache: none
            prepare_v8: "false"
          - part: api-types
            artifact: pr-fix-api-types
            commit_message: "chore: Update API types"
            needs_postgres: "false"
            cache: kache
            prepare_v8: "false"
          - part: schemas
            artifact: pr-fix-schemas
            commit_message: "chore: Update schemas"
            needs_postgres: "false"
            cache: kache
            prepare_v8: "true"
          - part: snapshots
            artifact: pr-fix-snapshots
            commit_message: "chore: Update snapshots"
            needs_postgres: "true"
            cache: kache
            prepare_v8: "true"
          - part: clippy
            artifact: pr-fix-clippy
            commit_message: "style: Run clippy"
            needs_postgres: "false"
            cache: rust-cache
            prepare_v8: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.load-pr.outputs.head_repo }}
          ref: ${{ needs.load-pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af || true
          df -h

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start postgres
        if: matrix.needs_postgres == 'true'
        run: docker run -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:18

      - name: Populate the nix store
        run: nix develop --command echo

      # Wasmtime's codegen cache key includes the host CPU features, which differ across runner SKUs.
      - id: cpu
        if: matrix.part == 'snapshots'
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          echo "flags=$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Reuse the test WASMs cached by check-test's `test.sh` job.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.part == 'snapshots'
        with:
          path: |
            target/wasm-cache
            test-codegen-cache
            test-wasm-cache
          key: wasm-cache-junit-default.xml-${{ runner.os }}-${{ steps.cpu.outputs.flags }}-${{ github.run_id }}
          restore-keys: |
            wasm-cache-junit-default.xml-${{ runner.os }}-${{ steps.cpu.outputs.flags }}-
            wasm-cache-junit-default.xml-${{ runner.os }}-

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # main, post-v1: adds pr-comment input
        if: matrix.cache == 'kache'
        with:
          pr-comment: false

      # Restore the cache of check's `clippy` job without overwriting it with PR builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.cache == 'rust-cache'
        with:
          shared-key: clippy
          save-if: false

      - name: Prepare V8
        if: matrix.prepare_v8 == 'true'
        run: nix develop --command scripts/ci-prepare-v8.sh

      - name: Run fixer
        env:
          CI: true
          INSTA_UPDATE: always
          TEST_POSTGRES_HOST: "localhost"
          TEST_POSTGRES_USER: "postgres"
          TEST_POSTGRES_PASSWORD: "postgres"
          TEST_POSTGRES_DATABASE_PREFIX: "obelisk_test"
        run: |
          case "${{ matrix.part }}" in
            embedded-assets-hash)
              ./scripts/update-embedded-assets-hash.sh
              ;;
            api-types)
              nix develop --command scripts/update-api-types.sh
              ;;
            schemas)
              nix develop --command scripts/update-schemas.sh
              ;;
            snapshots)
              find . -name '*.snap' -delete
              nix develop --command scripts/test.sh
              ;;
            clippy)
              nix develop --command scripts/clippy.sh
              ;;
          esac

      - name: Create patch artifact
        # Write outside the checkout, or `git add -A` commits the artifact itself.
        run: |
          mkdir -p "${RUNNER_TEMP}/pr-fix"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.part }}"
          else
            git commit -m "${{ matrix.commit_message }}"
            git format-patch --stdout HEAD~1 > "${RUNNER_TEMP}/pr-fix/${{ matrix.part }}.patch"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/pr-fix
          if-no-files-found: ignore

  combine-fixes:
    needs:
      - load-pr
      - fix-part
    # Push the parts that succeeded even if another part failed.
    if: ${{ !cancelled() && needs.load-pr.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.load-pr.outputs.head_repo }}
          ref: ${{ needs.load-pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-fix-*
          path: /tmp/pr-fix-artifacts
          # A lone matching artifact would otherwise skip its per-artifact subdirectory.
          merge-multiple: true

      - name: Apply patches
        run: |
          for part in embedded-assets-hash api-types schemas snapshots clippy; do
            patch_file="/tmp/pr-fix-artifacts/${part}.patch"
            if [ -f "${patch_file}" ]; then
              git am --3way "${patch_file}"
            else
              echo "No patch for ${part}"
            fi
          done

      - name: Push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ needs.load-pr.outputs.head_ref }}
        run: |
          if git diff --quiet HEAD "origin/${HEAD_REF}"; then
            echo "No commits to push"
            exit 0
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"
