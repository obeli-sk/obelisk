name: release-3.1-cachix-push

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"

defaults:
  run:
    shell: bash -xe {0}

jobs:
  cachix-push:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        package:
          - default
          - gnu-embedded
          - musl-embedded
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix push
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'obeli-sk' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-rustc-|-cargo-|-rust-std-|-rust-src-|-clippy-|-rustfmt-|-rust-analyzer-|-llvm-tools-|-rust-docs-|-miri-)"

      - name: Build Nix package
        run: |
          package='${{ matrix.package }}'
          case "$package" in
            gnu*|musl*) package="obeliskCross-${{ matrix.arch }}-unknown-linux-${package}" ;;
          esac
          nix build ".#$package"
