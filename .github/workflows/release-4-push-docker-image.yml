# TODO: Use flakes to generate the docker image

name: release-4-push-docker-image

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      release_id:
        description: "GitHub release ID"
        required: true
        type: string
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
        default: true
      publish_release:
        description: "Publish the GitHub release after Docker images are uploaded"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      release_id:
        description: "GitHub release ID"
        required: true
        type: string
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
      publish_release:
        description: "Publish the GitHub release after Docker images are uploaded"
        required: true
        type: boolean

defaults:
  run:
    shell: bash -xe {0}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.push_unversioned_tags }}" = "true" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            echo "::error::push_unversioned_tags requires publish_release"
            exit 1
          fi

  push-image:
    needs: validate-inputs
    name: ${{ matrix.dockerfile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tarfile: obelisk-x86_64-unknown-linux-gnu.tar.gz
            dockerfile: ubuntu-24.04.Dockerfile
            image_tag: ubuntu

          - tarfile: obelisk-x86_64-unknown-linux-gnu-embedded.tar.gz
            dockerfile: ubuntu-24.04.Dockerfile
            image_tag: ubuntu-embedded

          - tarfile: obelisk-x86_64-unknown-linux-gnu.tar.gz
            dockerfile: ubuntu-24.04-litestream.Dockerfile
            image_tag: ubuntu-litestream

          - tarfile: obelisk-x86_64-unknown-linux-gnu-embedded.tar.gz
            dockerfile: ubuntu-24.04-litestream.Dockerfile
            image_tag: ubuntu-litestream-embedded

          - tarfile: obelisk-x86_64-unknown-linux-musl.tar.gz
            dockerfile: alpine.Dockerfile
            image_tag: alpine

          - tarfile: obelisk-x86_64-unknown-linux-musl-embedded.tar.gz
            dockerfile: alpine.Dockerfile
            image_tag: alpine-embedded

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - id: git-info
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Download and extract binary
        run: |
          mkdir tmp
          curl --fail -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/obeli-sk/obelisk/releases/$RELEASE_ID" > release.json
          ASSET_ID=$(jq -r --arg name '${{ matrix.tarfile }}' '.assets[] | select(.name == $name) | .id' release.json)
          if [ -z "$ASSET_ID" ]; then
            echo "::error::Release asset ${{ matrix.tarfile }} not found"
            exit 1
          fi
          curl --fail -L \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/obeli-sk/obelisk/releases/assets/$ASSET_ID" \
            -o "tmp/${{ matrix.tarfile }}"
          tar xvfz "tmp/${{ matrix.tarfile }}" -C tmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}

      - name: Build and push docker image
        run: |
          docker login -u getobelisk -p ${{ secrets.DOCKER_HUB_TOKEN }}
          IMAGE_BASE="getobelisk/obelisk"
          TAGS=("${IMAGE_BASE}:${VERSION}-${{ matrix.image_tag }}")
          if [ "${{ inputs.push_unversioned_tags }}" = "true" ]; then
            TAGS+=("${IMAGE_BASE}:${{ matrix.image_tag }}")
            if [ "${{ matrix.image_tag }}" = "ubuntu" ]; then
              TAGS+=("${IMAGE_BASE}:latest")
            fi
          fi
          PUSH=true scripts/build-docker-image.sh \
            tmp/obelisk \
            .github/workflows/release/docker-image/server.toml \
            .github/workflows/release/docker-image/${{ matrix.dockerfile }} \
            "${TAGS[@]}"
        env:
          VERSION: ${{ steps.git-info.outputs.version }}

  publish-release:
    needs: push-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.publish_release }}
        with:
          ref: ${{ inputs.ref }}

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          TAG="v$VERSION"
          curl --fail -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/obeli-sk/obelisk/releases/${{ inputs.release_id }}"

  verify-github-release:
    needs: publish-release
    if: ${{ inputs.publish_release }}
    uses: ./.github/workflows/release-5-verify-github-release.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  verify-download-sh:
    needs: publish-release
    if: ${{ inputs.publish_release && inputs.push_unversioned_tags }}
    uses: ./.github/workflows/release-5-verify-download-sh.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  verify-run-nix:
    needs: publish-release
    if: ${{ inputs.publish_release }}
    uses: ./.github/workflows/release-5-verify-run-nix.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  verify-cargo-install:
    needs: publish-release
    if: ${{ inputs.publish_release }}
    uses: ./.github/workflows/release-5-verify-cargo-install.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  verify-cargo-binstall:
    needs: publish-release
    if: ${{ inputs.publish_release }}
    uses: ./.github/workflows/release-5-verify-cargo-binstall.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  verify-docker:
    needs: publish-release
    if: ${{ inputs.publish_release }}
    uses: ./.github/workflows/release-5-verify-docker.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
