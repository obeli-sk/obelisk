name: release-3.1-upload-artifacts

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      release_id:
        description: "GitHub release ID"
        required: true
        type: string
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      release_id:
        description: "GitHub release ID"
        required: true
        type: string
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash -xe {0}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.push_unversioned_tags }}" = "true" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            echo "::error::push_unversioned_tags requires publish_release"
            exit 1
          fi

  upload-assets:
    needs: validate-inputs
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu-embedded
            os: ubuntu-24.04

          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl-embedded
            os: ubuntu-24.04

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu-embedded
            os: ubuntu-24.04

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl-embedded
            os: ubuntu-24.04

          - target: x86_64-apple-darwin
            os: ubuntu-24.04
          - target: x86_64-apple-darwin-embedded
            os: ubuntu-24.04

          - target: aarch64-apple-darwin
            os: ubuntu-24.04
          - target: aarch64-apple-darwin-embedded
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - id: git-info
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - id: release-info
        run: |
          curl --fail -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/obeli-sk/obelisk/releases/${{ inputs.release_id }} > release.json
          RELEASE_ID=$(jq -r '.id' release.json)
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          if [ "$(jq -r .target_commitish release.json)" != "${{ steps.git-info.outputs.sha }}" ]; then
            echo "::error::Release $TAG targets a different commit"
            exit 1
          fi
          ASSET_NAME="obelisk-${{ matrix.target }}.tar.gz"
          if jq -e --arg name "$ASSET_NAME" \
            '.assets[] | select(.name == $name and .state == "uploaded" and .size > 0)' \
            release.json > /dev/null; then
            echo "asset_exists=true" >> $GITHUB_OUTPUT
          else
            ASSET_ID=$(jq -r --arg name "$ASSET_NAME" \
              '.assets[] | select(.name == $name) | .id' release.json)
            if [ -n "$ASSET_ID" ]; then
              curl --fail -L -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/obeli-sk/obelisk/releases/assets/$ASSET_ID"
            fi
            echo "asset_exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Obelisk with Nix
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        run: nix build '.#obeliskCross-${{ matrix.target }}'

      - name: Generate attestation for obelisk binary
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'result/bin/obelisk'

      - name: Create a tar.gz archive
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        run: tar czf archive.tar.gz --transform='s/^result\/bin\///' result/bin/obelisk

      - name: Generate attestation for tar.gz
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'archive.tar.gz'

      - name: Upload the archive
        if: ${{ steps.release-info.outputs.asset_exists == 'false' }}
        run: |
          curl -v --fail -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @archive.tar.gz \
            "https://uploads.github.com/repos/obeli-sk/obelisk/releases/${{ steps.release-info.outputs.release_id }}/assets?name=obelisk-${{ matrix.target }}.tar.gz"

  verify-assets:
    needs: upload-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - name: Verify assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          TAG="v$VERSION"
          curl --fail -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/obeli-sk/obelisk/releases/${{ inputs.release_id }}" > release.json

          expected=$(printf '%s\n' \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-gnu-embedded \
            x86_64-unknown-linux-musl x86_64-unknown-linux-musl-embedded \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-gnu-embedded \
            aarch64-unknown-linux-musl aarch64-unknown-linux-musl-embedded \
            x86_64-apple-darwin x86_64-apple-darwin-embedded \
            aarch64-apple-darwin aarch64-apple-darwin-embedded \
            | sed 's/^/obelisk-/; s/$/.tar.gz/' | sort)
          actual=$(jq -r '.assets[].name' release.json | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release $TAG does not contain the expected asset set"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          if jq -e '.assets[] | select(.state != "uploaded" or .size == 0)' release.json > /dev/null; then
            echo "::error::Release $TAG contains an incomplete asset"
            exit 1
          fi

  call_child:
    needs: verify-assets
    uses: ./.github/workflows/release-4-push-docker-image.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      release_id: ${{ inputs.release_id }}
      push_unversioned_tags: ${{ inputs.push_unversioned_tags }}
      publish_release: ${{ inputs.publish_release }}
