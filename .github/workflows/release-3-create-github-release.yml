name: release-3-create-github-release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      push_unversioned_tags:
        description: "Push unversioned Docker tags"
        required: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean
defaults:
  run:
    shell: bash -xe {0}

jobs:
  create-github-release:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.git-info.outputs.sha }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.push_unversioned_tags }}" = "true" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            echo "::error::push_unversioned_tags requires publish_release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - id: git-info
        run: |
          VERSION="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        run: |
          echo "Releasing $TAG $SHA"
          body=$(./scripts/extract-release-info.sh "$VERSION" | jq -R -s .)
          status=$(curl -sS -o release.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{
              "tag_name": "'"$TAG"'",
              "target_commitish": "'"$SHA"'",
              "name": "obelisk-'"$TAG"'",
              "body": '"$body"',
              "draft": true,
              "prerelease": ${{ inputs.prerelease }}
            }' \
            https://api.github.com/repos/obeli-sk/obelisk/releases
          )

          # A rerun may find the release created by an earlier partial attempt.
          if [ "$status" = "422" ]; then
            curl --fail -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/obeli-sk/obelisk/releases/tags/$TAG" > release.json
          elif [ "$status" != "201" ]; then
            cat release.json
            exit 1
          fi

          if [ "$(jq -r .target_commitish release.json)" != "$SHA" ]; then
            echo "::error::Release $TAG targets a different commit"
            exit 1
          fi
          if [ "$(jq -r .prerelease release.json)" != "${{ inputs.prerelease }}" ]; then
            echo "::error::Release $TAG has a different prerelease setting"
            exit 1
          fi

          for attempt in {1..30}; do
            if curl --fail -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/obeli-sk/obelisk/releases/tags/$TAG"; then
              exit 0
            fi

            echo "Release tag $TAG not readable yet, retrying ($attempt/30)"
            sleep 2
          done

          echo "Timed out waiting for release tag $TAG to become readable"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.git-info.outputs.sha }}
          TAG: ${{ steps.git-info.outputs.tag }}
          VERSION: ${{ steps.git-info.outputs.version }}

  call_child:
    needs: create-github-release
    uses: ./.github/workflows/release-3.1-upload-artifacts.yml
    secrets: inherit
    with:
      ref: ${{ needs.create-github-release.outputs.sha }}
      push_unversioned_tags: ${{ inputs.push_unversioned_tags }}
      publish_release: ${{ inputs.publish_release }}
