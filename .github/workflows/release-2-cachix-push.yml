name: release-2-cachix-push

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      push_unversioned_tags:
        description: "Push unversioned Docker tags (requires publishing the release)"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string
        default: "latest"
      push_unversioned_tags:
        description: "Push unversioned Docker tags (requires publishing the release)"
        required: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
      publish_release:
        description: "Publish the GitHub release after artifacts and Docker images are uploaded"
        required: true
        type: boolean

defaults:
  run:
    shell: bash -xe {0}

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.push_unversioned_tags }}" = "true" ] && [ "${{ inputs.publish_release }}" != "true" ]; then
            echo "::error::push_unversioned_tags requires publish_release"
            exit 1
          fi

  cachix-push:
    needs: validate-inputs
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        package:
          - default
          - obeliskLibcNix-embedded
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Cachix push
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'obeli-sk' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: "(-rustc-|-cargo-|-rust-std-|-rust-src-|-clippy-|-rustfmt-|-rust-analyzer-|-llvm-tools-|-rust-docs-|-miri-)"

      - name: Build Nix package
        run: nix build '.#${{ matrix.package }}'

  call_child:
    needs: cachix-push
    uses: ./.github/workflows/release-3-create-github-release.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      push_unversioned_tags: ${{ inputs.push_unversioned_tags }}
      prerelease: ${{ inputs.prerelease }}
      publish_release: ${{ inputs.publish_release }}
