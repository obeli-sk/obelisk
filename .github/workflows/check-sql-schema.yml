name: check-sql-schema

on:
  push:
    branches:
      - main
      - latest
  pull_request:

# If new code is pushed to a PR branch, then cancel in progress workflows for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  check-sql-schema:
    runs-on: ubuntu-24.04
    env:
      # kache 0.12 can report build-script hits without restoring Cargo's expected executable.
      KACHE_CACHE_EXECUTABLES: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Populate the nix store
        run: nix develop --command echo

      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # main, post-v1: adds pr-comment input
        with:
          pr-comment: false

      # rusty_v8 stores its downloaded native archive outside Cargo's crate artifacts.
      - name: Build V8 without kache
        run: nix develop --command env RUSTC_WRAPPER= cargo build --package v8

      - name: Build obelisk
        run: |
          nix develop --command cargo build --bin obelisk
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Run `dump-sql-schema.sh`
        run: |
          nix develop --command scripts/dump-sql-schema.sh
          if [ -n "$(git status --porcelain assets/schemas/sql/)" ]; then
            echo "::error::SQL schema dump is stale. Run 'scripts/dump-sql-schema.sh' and commit the result."
            git diff -- assets/schemas/sql/
            exit 1
          fi
