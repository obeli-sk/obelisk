## App policy, reviewed by the app admin. Pass this file with --app-config.
## It declares the app's required inputs and the maximum privileges any deployment may use:
## secrets and their exposure, public environment variables, outbound HTTP, and exec activities.
## Missing required inputs fail at startup so executions do not discover them at runtime.
## Set an app name before starting the server; it selects the default SQLite directory.
## Names use 4-25 lowercase ASCII letters, digits, or interior hyphens.
# app_name = "my-app"

## Optional hosted VM settings; omitted memory uses the cloud default.
# [cloud]
# memory_mb = 512

## Registered secrets default to type = "env", reading app environment at startup.
## server.toml app_env_prefix is prepended to environment source names.
## They are removed from the process environment before workers start.
# [secrets]
# OPENAI_API_KEY = {}
# GITHUB_TOKEN = { optional = true }
## Internal secrets use the generated startup token, grant full API access and rotate on restart.
## They require an enabled authenticated API and reject optional; existing exposure grants still apply.
# INTERNAL_TOKEN = { type = "internal" }
## Exposed plaintext requires a reviewed component digest.
# [secrets.OPENAI_API_KEY.exposed_to]
# worker = "sha256:..."

## Public environment variables available to deployments. Entries are required at startup.
## Optional entries may be absent, but a deployment must use an optional reference or fallback.
# [public_env]
# REGION = {}
# TRACE_ID = { optional = true }
## Internal entries ignore process environment values and require an available source.
## API URLs use the listener address, replacing wildcard binds with loopback.
## Web UI URLs use webui.public_url when configured, otherwise its local listener.
# OBELISK_API_URL = { type = "internal", source = "api-url" }
# OBELISK_UI_URL = { type = "internal", source = "webui-url" }

## App-reviewed exec components. Both app and platform admins must approve each digest.
## Use a digest array during migrations; the platform must cover each digest.
# [allowed_exec_activities]
# worker = "sha256:..."

## Outbound HTTP needs matching app and deployment permissions. Both policies are applied;
## request_url_regex values need not be identical or subsets of each other.
# [[outbound_http.allowed_host]]
# pattern = "api.github.com"
# methods = ["POST"]
# request_url_regex = "^GET https://api\\.github\\.com/repos/"
# secrets = ["OPENAI_API_KEY", { name = "GITHUB_TOKEN", optional = true }]
# replace_in = ["headers"]

## Alternatively, use a single base URL for the application and its HTTP permissions.
## url_prefix replaces pattern and request_url_regex; the original form supports wildcards.
## The prefix must be an absolute HTTP(S) URL without credentials, query, fragment, or wildcards.
## Environment variables expand before the prefix is regex-escaped; a trailing slash is kept.
## url_regex_suffix is a grouped regex fragment appended to the literal prefix.
## A leading ^ is forbidden; $ requires an exact endpoint. Without a suffix, any continuation matches.
## Query parameters are excluded. App and deployment restrictions both apply at runtime.
# [[outbound_http.allowed_host]]
# url_prefix = "${LLM_URL:-https://openrouter.ai/api}"
# methods = ["GET"]
# url_regex_suffix = "/v1/models$"
