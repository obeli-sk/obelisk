## App policy. Pass this file explicitly with --app-config.
## A named app gets a separate default SQLite database.
# app_name = "my-app"

## Registered secrets read same-named environment variables at startup.
## They are removed from the process environment before workers start.
# [secrets]
# OPENAI_API_KEY = {}
# GITHUB_TOKEN = { optional = true }
## Exposed plaintext requires a reviewed component digest.
# [secrets.OPENAI_API_KEY.exposed_to]
# worker = "sha256:..."

## Public environment variables available to deployments.
# [public_env]
# allowed = ["REGION"]

## App-reviewed exec components. The platform must also enable or allow them.
# [allowed_exec_activities]
# worker = "sha256:..."

## Outbound HTTP requires matching entries here and in deployment.toml.
# [[outbound_http.allowed_host]]
# pattern = "api.example.com"
# methods = ["POST"]
