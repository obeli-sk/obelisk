[package]
name = "obeli-sk-concepts"
description = "Internal package of obelisk"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
val-json.workspace = true

arbitrary.workspace = true
assert_matches.workspace = true
async-trait = { workspace = true, optional = true }
cfg-if.workspace = true
chrono.workspace = true
const_format.workspace = true
deadpool-postgres = { optional = true, workspace = true }
derive-where.workspace = true
derive_more.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
opentelemetry = { workspace = true, optional = true }
sha2.workspace = true
tokio-postgres = { optional = true, workspace = true }
rand.workspace = true
rusqlite = { optional = true, workspace = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing.workspace = true
tracing-error.workspace = true
ulid.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-environ = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
rstest.workspace = true

[features]
default = ["runtime"]
# Everything except the serde types; disable to build for wasm32-unknown-unknown.
runtime = [
    "dep:async-trait",
    "dep:opentelemetry",
    "dep:tokio",
    "dep:tracing-opentelemetry",
    "dep:wasmtime",
    "dep:wasmtime-environ",
    "val-json/wasmtime",
]
test = ["runtime"]
rusqlite = ["runtime", "dep:rusqlite"]
postgres = ["runtime", "dep:tokio-postgres", "dep:deadpool-postgres"]

[lints]
workspace = true
