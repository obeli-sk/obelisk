app_name = "testing-wasm"
# Webhooks of the test deployments listen on `external`, which has no credentials.
public_http_servers = ["external"]

[[outbound_http.allowed_host]]
pattern = "*"
methods = "*"

[[outbound_http.allowed_host]]
pattern = "httpbin.org"
methods = "*"
secrets = ["MY_SECRET"]
replace_in = ["headers", "params", "body"]

[secrets]
MY_SECRET = {}
