allow_exec_activities = true

[log.file]
level = "info,obeli_sk_wasm_workers=debug"
enabled = true
target = true
directory = "."
prefix = "obelisk.log" # File name prefix

[[outbound_http.allowed_host]]
pattern = "*"
methods = "*"

[[outbound_http.allowed_host]]
pattern = "httpbin.org"
methods = "*"
secrets = ["MY_SECRET"]
replace_in = ["headers", "params", "body"]

[secrets]
MY_SECRET = { env = "MY_SECRET" }


