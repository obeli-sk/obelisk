# A few JavaScript demos to sanity-check a local server. Everything is inline, so the file
# doubles as a readable starting point.
#
#   obelisk server run -s server-testing-js.toml -d deployment-testing-js-local.toml --no-auth
#   obelisk execution submit --follow testing:demo/workflow.add-via-activity '[1, 2]'
#   obelisk execution submit --follow testing:demo/workflow.my-ip '[]'
#   curl localhost:9090/hello
#   curl localhost:9090/add/5/7

[[activity_js]]
ffqn = "testing:demo/activity.add"
content = '''
export default function add(a, b) {
    return a + b;
}
'''
params = [
  { name = "a", type = "u32" },
  { name = "b", type = "u32" },
]
return_type = "result<u32>"
max_retries = 0

# Workflows are deterministic and replayable, so all I/O happens in activities they call.
[[workflow_js]]
ffqn = "testing:demo/workflow.add-via-activity"
content = '''
import { add } from 'testing:demo/activity';

export default function add_via_activity(a, b) {
    const result = add(a, b);
    console.log('activity returned', result);
    return result;
}
'''
params = [
  { name = "a", type = "u32" },
  { name = "b", type = "u32" },
]
return_type = "result<u32>"

# Outbound HTTP needs an allowlist entry here and a matching one in the server configuration.
[[activity_js]]
ffqn = "testing:demo/activity.fetch-ip"
content = '''
export default async function fetch_ip() {
    const resp = await fetch('https://api.ipify.org?format=json');
    const body = await resp.json();
    return body.ip;
}
'''
params = []
return_type = "result<string, string>"
max_retries = 0
[[activity_js.allowed_host]]
pattern = "api.ipify.org"
methods = ["GET"]

[[workflow_js]]
ffqn = "testing:demo/workflow.my-ip"
content = '''
import { fetchIp } from 'testing:demo/activity';

export default function my_ip() {
    return fetchIp();
}
'''
params = []
return_type = "result<string, string>"

[[webhook_endpoint_js]]
name = "webhook_hello"
routes = [{ methods = ["GET"], route = "/hello" }]
content = '''
import * as obelisk from 'obelisk:webhook@1.0.0';

export default function handle(request) {
    return new Response(`Hello from ${obelisk.executionIdCurrent()}\n`, {
        headers: { 'content-type': 'text/plain' },
    });
}
'''

# Route parameters arrive as environment variables.
[[webhook_endpoint_js]]
name = "webhook_add"
routes = [{ methods = ["GET"], route = "/add/:a/:b" }]
content = '''
import { addViaActivity } from 'testing:demo/workflow';

export default function handle(request) {
    const result = addViaActivity(Number(process.env['a']), Number(process.env['b']));
    return Response.json({ result });
}
'''
