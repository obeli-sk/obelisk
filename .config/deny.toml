# Documentation for this configuration file can be found here
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "deny"
wildcards = "allow"
deny = []
skip = [
    # wasmtime-wasi uses witx which requires thiserror 1.x and wast 35.x
    { name = "thiserror", version = "1" },
    { name = "thiserror-impl", version = "1" },
    { name = "wast", version = "35" },
    # ring uses getrandom 0.2
    { name = "getrandom", version = "0.2" },
    # rand 0.9 uses getrandom 0.3; we directly depend on getrandom 0.4
    { name = "getrandom", version = "0.3" },
    # obelisk uses rand 0.9; postgres-protocol requires rand 0.10
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },
    # wasm-compose (via petgraph 0.6) requires fixedbitset 0.4
    { name = "fixedbitset", version = "0.4" },
    # hashbrown 0.14.5 used by boa_engine
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.16.1" },
    # deno_core uses itertools 0.13; wasmtime uses 0.14; workspace and Boa use 0.15
    { name = "itertools", version = "0.13" },
    { name = "itertools", version = "0.14" },
    # boa_interner requires phf 0.14 while tokio-postgres uses 0.13
    { name = "phf", version = "0.14" },
    { name = "phf_shared", version = "0.14" },
    # reqwest 0.13 and oci-client 0.17 require base64 0.23; everything else uses 0.22
    { name = "base64", version = "0.23" },
    # wasmtime's cranelift-codegen and boa_engine pin the sha2 0.10 suite; postgres-protocol requires sha2 0.11
    { name = "sha2", version = "0.10" },
    { name = "digest", version = "0.10" },
    { name = "block-buffer", version = "0.10" },
    { name = "crypto-common", version = "0.1" },
    { name = "cpufeatures", version = "0.2" },
    # jsonwebtoken 10 (required by oci-client 0.17) uses signature 2; ed25519-dalek 3 uses signature 3
    { name = "signature", version = "2" },
    # oci-wasm uses wit-component 0.253 (older wasm-tools suite)
    { name = "wasmparser", version = "0.253" },
    { name = "wasm-encoder", version = "0.253" },
    { name = "wasm-metadata", version = "0.253" },
    { name = "wit-component", version = "0.253" },
    { name = "wit-parser", version = "0.253" },
    # oci-spec (via oci-client) requires strum 0.27 and darling 0.20
    { name = "strum", version = "0.27" },
    { name = "strum_macros", version = "0.27" },
    { name = "darling", version = "0.20" },
    { name = "darling_core", version = "0.20" },
    { name = "darling_macro", version = "0.20" },
    # tokio-postgres (via postgres-protocol) requires fallible-iterator 0.2
    { name = "fallible-iterator", version = "0.2" },
    # tokio-postgres-rustls 0.13 (latest) requires x509-cert 0.2 which uses const-oid 0.9;
    # postgres-protocol uses digest 0.11 which requires const-oid 0.10
    { name = "const-oid", version = "0.9" },
    # Deno and V8 retain older versions of dependencies used elsewhere in the workspace
    { name = "fastrand", version = "1" },
    { name = "futures-lite", version = "1" },
    { name = "linux-raw-sys", version = "0.4" },
    { name = "num-bigint", version = "0.4" },
    { name = "rustix", version = "0.38" },
    { name = "shlex", version = "1" },
    # proc-macro ecosystem is mid-migration: syn 3 is used by serde_derive, async-trait,
    # tokio-macros, thiserror-impl 2, etc., while many crates still pull syn 2
    { name = "syn", version = "2" },
]

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
ignore = [
    # paste is unmaintained; also pulled in by utoipa-axum so unavoidable
    { id = "RUSTSEC-2024-0436" },
    # zstd 0.13 pinned by wasmtime-internal-cache, which only uses bulk encode_all/decode_all
    # without default features: no with_context streams, seekable, or legacy decoding.
    { id = "RUSTSEC-2026-0391" },
    { id = "RUSTSEC-2026-0398" },
    { id = "RUSTSEC-2026-0403" },
]
