app_name = "__APP_NAME__"

# The app admin reviews which external requests a deployment may make.
# `https://*` allows any HTTPS host on port 443; narrow it to the hosts you want to monitor.
[[outbound_http.allowed_host]]
pattern = "https://*"
methods = ["GET"]

# Optional base URL of the Web UI, linked from the dashboard. Defaults to the dashboard's host on port 8080.
[public_env]
WEBUI_URL = { optional = true }
